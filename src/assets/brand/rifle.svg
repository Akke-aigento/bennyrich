    <path d="M204 187 C200 208 190 232 182 246 C176 257 186 266 199 265 C211 264 219 255 222 243 C227 220 231 197 232 187" stroke-width="2.6" />
    <path d="M199 210 C207 214 217 213 226 209" stroke-width="1.4" opacity="0.7" />
    <path d="M193 228 C201 232 211 231 220 227" stroke-width="1.4" opacity="0.7" />

