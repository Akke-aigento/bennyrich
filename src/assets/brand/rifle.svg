    <path d="M302 140 L436 140 L436 180 L302 180 Z" stroke-width="2.6" />
    <path d="M302 128 L452 128 L452 138 L302 138" stroke-width="1.8" />
    <circle cx="330" cy="160" r="7" stroke-width="1.5" />
    <circle cx="360" cy="160" r="7" stroke-width="1.5" />
    <circle cx="390" cy="160" r="7" stroke-width="1.5" />
    <circle cx="420" cy="160" r="7" stroke-width="1.5" />

