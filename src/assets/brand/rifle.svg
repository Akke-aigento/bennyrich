    <path d="M594 143 L636 143 L636 173 L594 173 Z" stroke-width="2.6" />
    <path d="M604 143 L604 173" stroke-width="1.4" opacity="0.7" />
    <path d="M616 143 L616 173" stroke-width="1.4" opacity="0.7" />
    <path d="M628 143 L628 173" stroke-width="1.4" opacity="0.7" />
